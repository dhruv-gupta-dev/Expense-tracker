<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense tracker</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <div class="bal">
            <h2>Your Balance</h2>
            <h2 id="balance">$0.00</h2>
        </div>
        <div class="earn-expend">
            <div class="money-earn" id="money-earn">
                <h3>Income</h3>
                <p id="money-plus" class="money-plus">$0.00</p>
            </div>
            <div class="money-expend" id="money-expend">
                <h3>Expense</h3>
                <p id="money-minus" class="money-minus">$0.00</p>
            </div>
        </div>
        <div class="his">
            <ul class="lst" id="lst">

            </ul>
        </div>
        <div class="transaction">
            <h3>Transaction</h3>
            <form action="" id="form">
                <div>
                    <label for="text">
                        Text:<input type="text" id="text" placeholder="Enter Text: ">
                    </label>
                </div>
                <div>
                    <label for="amount">
                        Amount:<input type="number" id="amount" placeholder="Enter Amount: $0.00">
                    </label>
                </div>
                <button class="button" id="button">Add Transaction</button>
            </form>

        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
